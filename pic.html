<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Image Gallery</title>
    <link rel="stylesheet" href="pic.css">
</head>

<body>

<header>
    <div class="logo">✦MEMORA</div>

    <div class="header-buttons">
        <button id="themeBtn">🌙</button>
        <button id="uploadBtn" class="upload-btn">＋ Upload</button>
    </div>
</header>

<main>

    <section class="hero">
        <p>YOUR DIGITAL COLLECTION</p>
        <h1>Explore your <span>visual world.</span></h1>
        <div class="hero-text">
            Discover, organize and manage your favorite images. created by <span class="MASANAM">S.MASANAM</span>
        </div>
    </section>

    <section class="toolbar">

        <div class="search">
            🔍
            <input
                type="text"
                id="searchInput"
                placeholder="Search images..."
            >
        </div>

        <select id="sortSelect">
            <option value="default">Sort: Default</option>
            <option value="az">Name: A → Z</option>
            <option value="za">Name: Z → A</option>
            <option value="favorites">Most Favorites</option>
        </select>

    </section>

    <section class="filters">

        <button class="filter active" data-category="all">All</button>
        <button class="filter" data-category="nature">🌿 Nature</button>
        <button class="filter" data-category="travel">✈️ Travel</button>
        <button class="filter" data-category="animals">🐾 Animals</button>
        <button class="filter" data-category="technology">💻 Technology</button>
        <button class="filter" data-category="food">🍕 Food</button>
        <button class="filter" data-category="favorites">❤️ Favorites</button>

    </section>

    <section class="stats">

        <div>
            <small>Total Images</small>
            <strong id="totalImages">0</strong>
        </div>

        <div>
            <small>Categories</small>
            <strong id="totalCategories">0</strong>
        </div>

        <div>
            <small>Favorites</small>
            <strong id="totalFavorites">0</strong>
        </div>

    </section>

    <section id="gallery" class="gallery"></section>

    <div id="noResults" class="no-results">
        <div>🖼️</div>
        <h2>No images found</h2>
        <p>Try another search or category.</p>
    </div>

</main>


<!-- UPLOAD MODAL -->

<div id="uploadModal" class="modal">

    <div class="modal-box">

        <button id="closeUpload" class="close">×</button>

        <h2>Upload Image</h2>
        <p>Add your own image to the gallery.</p>

        <label class="upload-area">

            <div>📤</div>
            <strong>Choose Image</strong>
            <small>JPG, PNG, WEBP</small>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

        </label>

        <input
            type="text"
            id="imageTitle"
            placeholder="Image title"
        >

        <select id="imageCategory">

            <option value="nature">Nature</option>
            <option value="travel">Travel</option>
            <option value="animals">Animals</option>
            <option value="technology">Technology</option>
            <option value="food">Food</option>

        </select>

        <button id="addImage" class="primary">
            Add Image
        </button>

    </div>

</div>


<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">

    <button id="closeLightbox" class="close-lightbox">
        ×
    </button>

    <div class="lightbox-top">

        <span id="counter">1 / 1</span>

        <div class="zoom-buttons">
            <button id="zoomOut">−</button>
            <button id="zoomReset">100%</button>
            <button id="zoomIn">＋</button>
            <button id="fullscreen">⛶</button>
        </div>

    </div>

    <button id="prevBtn" class="navigation prev">❮</button>

    <div class="preview">

        <img id="previewImage" src="" alt="Preview">

        <h2 id="previewTitle"></h2>

        <p id="previewCategory"></p>

    </div>

    <button id="nextBtn" class="navigation next">❯</button>

    <div class="lightbox-actions">

        <button id="favoriteBtn">♡ Favorite</button>
        <button id="downloadBtn">⬇ Download</button>
        <button id="shareBtn">↗ Share</button>
        <button id="slideshowBtn">▶ Slideshow</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
